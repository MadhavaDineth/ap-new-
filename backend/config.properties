# =====================================================================
#  SmileCare backend configuration
#  Edit this file rather than the Java source.
# =====================================================================

# --- database -------------------------------------------------------
db.url=jdbc:mysql://localhost:3306/smilecare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
db.user=root
db.password=

# --- server ---------------------------------------------------------
server.port=8090

# Folder holding index.html and the css/js folders, relative to where the
# server is started from. The server hosts the front end as well, so the
# whole system can run on http://localhost:8090 with no CORS at all.
web.root=..

# Origin allowed to call the API when the pages are opened through WAMP
# on port 80 instead. Use * only while developing.
cors.origin=http://localhost
